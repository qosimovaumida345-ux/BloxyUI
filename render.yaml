services:
  - type: web
    name: bloxyui
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloxyui-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

databases:
  - name: bloxyui-db
    plan: free
